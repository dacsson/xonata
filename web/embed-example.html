<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Xonata embedding example</title>
<style>body{font-family:ui-monospace,monospace;background:#13171d;color:#dae2eb;margin:0;padding:24px}canvas{width:100%;height:80vh;background:#13171d;border:1px solid #38434f}</style></head>
<body>
  <h1>Embedded pipeline viewer</h1>
  <p>The viewer mounts into a canvas in an ordinary web page. Open a local Kanata trace using its toolbar.</p>
  <canvas id="pipeline" tabindex="0"></canvas>
  <script type="module">
    import init, { WebHandle } from './pkg/xonata_web.js';
    await init();
    const viewer = new WebHandle();
    await viewer.start(document.getElementById('pipeline'));
    // Optional: obtain these settings from your host's session configuration.
    // await viewer.configure_agent(JSON.stringify({
    //   base_url: 'https://your-compatible-proxy.example/v1',
    //   api_key: 'session-provided-key', model: 'your-model'
    // }));
    // viewer.clear_agent_configuration(); // Cancels active runs and clears credentials.
    window.viewer = viewer;
    window.xonata = viewer;
  </script>
</body>
</html>
