[workspace]
members = ["crates/core", "crates/view", "crates/app", "crates/web"]
default-members = ["crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
egui = "0.32.3"
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.clippy]
perf = "deny"
